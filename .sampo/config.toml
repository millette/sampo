# Sampo configuration
version = 1

[git]
tag_format = "{ecosystem}-{package_name}-v{version}"

[changelog]
automatic_entries = "collapse"

[packages]
fixed = [[
  "cargo/sampo",
  "npm/@waglo-private/sampo",
  "npm/@waglo-private/sampo-linux-x64",
  "npm/@waglo-private/sampo-linux-arm64",
  "npm/@waglo-private/sampo-darwin-x64",
  "npm/@waglo-private/sampo-darwin-arm64",
  "npm/@waglo-private/sampo-win32-x64",
]]
