name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:

# Automatically cancel older in-progress jobs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

env:
  RUSTFLAGS: "-Dwarnings"
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: moonrepo/setup-rust@v1
        with:
          components: clippy

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features

      - name: Run Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: moonrepo/setup-rust@v1

      - name: Build
        run: cargo build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: moonrepo/setup-rust@v1

      # Installs the Node.js range package.json requires, and fails when none matches.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Check the npm shim
        run: node --version && node --check packages/sampo/bin/sampo.js

      - name: Test
        run: cargo test
